; Limites PHP para a API (cPanel com PHP-FPM/CGI lê este ficheiro; pode demorar até 5 min a aplicar).
; Se o alojamento usar mod_php, defina os mesmos valores em cPanel → MultiPHP INI Editor.
upload_max_filesize = 52M
post_max_size = 56M
max_execution_time = 60
memory_limit = 256M
expose_php = Off
display_errors = Off
log_errors = On
